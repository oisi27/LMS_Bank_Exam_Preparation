version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bank_lms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bank_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bank_secret_pass_2026}
      POSTGRES_DB: ${DB_NAME:-bank_exam_lms}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bank_lms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
